<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard | Hava Durumu Uygulaması</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #3498db;
  --secondary: #2c3e50;
  --accent: #e74c3c;
  --light: #ecf0f1;
  --dark: #1a1a1a;
  --text: #333;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s ease;
}

body.dark {
  background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
  color: #fff;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  color: white;
}

header h1 {
  font-size: 2.5em;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.theme-toggle {
  background: rgba(255, 255, 255, 0.2);
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.5em;
  transition: 0.3s;
}

.theme-toggle:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: scale(1.1);
}

.search-container {
  margin-bottom: 30px;
  display: flex;
  gap: 10px;
}

.search-container input {
  flex: 1;
  padding: 15px 20px;
  border: none;
  border-radius: 50px;
  font-size: 1em;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: var(--shadow);
  transition: 0.3s;
}

.search-container input:focus {
  outline: none;
  background: white;
  box-shadow: 0 0 0 3px var(--primary);
}

.search-container button {
  padding: 15px 30px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-size: 1em;
  font-weight: bold;
  transition: 0.3s;
  box-shadow: var(--shadow);
}

.search-container button:hover {
  background: #c0392b;
  transform: translateY(-2px);
}

.current-weather {
  background: white;
  border-radius: 20px;
  padding: 40px;
  margin-bottom: 30px;
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  align-items: center;
}

body.dark .current-weather {
  background: #2d2d2d;
  color: white;
}

.weather-icon {
  font-size: 120px;
  text-align: center;
}

.weather-info h2 {
  font-size: 2.5em;
  margin-bottom: 10px;
}

.weather-info p {
  font-size: 1.1em;
  margin-bottom: 15px;
  opacity: 0.8;
}

.weather-details {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-top: 20px;
}

.detail-box {
  background: var(--light);
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

body.dark .detail-box {
  background: #1a1a1a;
}

.detail-box p {
  font-size: 0.9em;
  opacity: 0.7;
  margin-bottom: 5px;
}

.detail-box span {
  font-size: 1.3em;
  font-weight: bold;
}

.forecast {
  margin-bottom: 30px;
}

.forecast h3 {
  color: white;
  margin-bottom: 20px;
  font-size: 1.5em;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
}

.forecast-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
}

.forecast-card {
  background: rgba(255, 255, 255, 0.95);
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
  transition: 0.3s;
}

.forecast-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

body.dark .forecast-card {
  background: #2d2d2d;
  color: white;
}

.forecast-card p {
  font-size: 0.9em;
  margin: 10px 0;
}

.forecast-icon {
  font-size: 3em;
  margin: 10px 0;
}

.forecast-temp {
  font-weight: bold;
  font-size: 1.2em;
}

.error {
  background: var(--accent);
  color: white;
  padding: 15px 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  display: none;
}

.error.show {
  display: block;
}

.loading {
  text-align: center;
  color: white;
  display: none;
  font-size: 1.2em;
}

.loading.show {
  display: block;
}

@media (max-width: 768px) {
  .current-weather {
    grid-template-columns: 1fr;
  }

  .weather-details {
    grid-template-columns: repeat(2, 1fr);
  }

  header h1 {
    font-size: 1.8em;
  }

  .forecast-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .search-container {
    flex-direction: column;
  }

  .weather-details {
    grid-template-columns: 1fr;
  }

  .forecast-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌤️ Weather Dashboard</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="search-container">
    <input 
      type="text" 
      id="cityInput" 
      placeholder="Şehir adı girin... (örn: İstanbul, London, New York)"
      onkeypress="if(event.key==='Enter') searchWeather()"
    >
    <button onclick="searchWeather()">Ara</button>
    <button onclick="getCurrentLocation()">📍 Konum</button>
  </div>

  <div class="error" id="error"></div>
  <div class="loading" id="loading">Yükleniyor...</div>

  <div class="current-weather" id="currentWeather" style="display: none;">
    <div class="weather-icon" id="weatherIcon"></div>
    <div class="weather-info">
      <h2 id="cityName"></h2>
      <p id="description"></p>
      <p id="temperature" style="font-size: 2em; margin: 20px 0;"></p>
      
      <div class="weather-details">
        <div class="detail-box">
          <p>Hissedilen</p>
          <span id="feelsLike"></span>
        </div>
        <div class="detail-box">
          <p>Nem</p>
          <span id="humidity"></span>
        </div>
        <div class="detail-box">
          <p>Basınç</p>
          <span id="pressure"></span>
        </div>
        <div class="detail-box">
          <p>Rüzgar</p>
          <span id="windSpeed"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="forecast" id="forecastSection" style="display: none;">
    <h3>5 Günlük Tahmin</h3>
    <div class="forecast-grid" id="forecastGrid"></div>
  </div>
</div>

<script>
const API_KEY = 'f85bb9a76e7ed1dcc892fbf77cfcb071';
const BASE_URL = 'https://api.openweathermap.org/data/2.5';

// Tema değiştir
function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}

// Sayfa yüklendiğinde tema ayarını al
window.addEventListener('load', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark');
  }
});

// Hava durumu ara
async function searchWeather() {
  const city = document.getElementById('cityInput').value.trim();
  if (!city) {
    showError('Lütfen bir şehir adı girin!');
    return;
  }
  fetchWeatherByCity(city);
}

// Şehre göre hava durumu getir
async function fetchWeatherByCity(city) {
  showLoading(true);
  hideError();
  
  try {
    const response = await fetch(
      `${BASE_URL}/weather?q=${city}&appid=${API_KEY}&units=metric&lang=tr`
    );
    
    if (!response.ok) {
      throw new Error('Şehir bulunamadı!');
    }
    
    const data = await response.json();
    displayCurrentWeather(data);
    fetchForecast(data.coord.lat, data.coord.lon);
  } catch (error) {
    showError(error.message);
  } finally {
    showLoading(false);
  }
}

// Konum bazlı hava durumu getir
async function getCurrentLocation() {
  if (navigator.geolocation) {
    showLoading(true);
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const { latitude, longitude } = position.coords;
        fetchWeatherByCoords(latitude, longitude);
      },
      (error) => {
        showError('Konum alınamadı!');
        showLoading(false);
      }
    );
  } else {
    showError('Konum servisi desteklenmiyor!');
  }
}

// Koordinatlara göre hava durumu getir
async function fetchWeatherByCoords(lat, lon) {
  try {
    const response = await fetch(
      `${BASE_URL}/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=tr`
    );
    const data = await response.json();
    document.getElementById('cityInput').value = data.name;
    displayCurrentWeather(data);
    fetchForecast(lat, lon);
  } catch (error) {
    showError('Hava durumu alınamadı!');
  } finally {
    showLoading(false);
  }
}

// 5 günlük tahmin getir
async function fetchForecast(lat, lon) {
  try {
    const response = await fetch(
      `${BASE_URL}/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=tr`
    );
    const data = await response.json();
    displayForecast(data.list);
  } catch (error) {
    console.error('Tahmin alınamadı:', error);
  }
}

// Güncel hava durumunu göster
function displayCurrentWeather(data) {
  const { name, main, weather, wind, clouds, sys } = data;
  
  document.getElementById('cityName').textContent = name;
  document.getElementById('description').textContent = 
    weather[0].description.charAt(0).toUpperCase() + weather[0].description.slice(1);
  document.getElementById('temperature').textContent = 
    `${Math.round(main.temp)}°C`;
  document.getElementById('feelsLike').textContent = 
    `${Math.round(main.feels_like)}°C`;
  document.getElementById('humidity').textContent = `${main.humidity}%`;
  document.getElementById('pressure').textContent = `${main.pressure} mb`;
  document.getElementById('windSpeed').textContent = 
    `${Math.round(wind.speed * 3.6)} km/h`;
  
  const weatherIcon = getWeatherIcon(weather[0].main);
  document.getElementById('weatherIcon').textContent = weatherIcon;
  
  document.getElementById('currentWeather').style.display = 'grid';
}

// Tahmin göster
function displayForecast(list) {
  const forecastGrid = document.getElementById('forecastGrid');
  forecastGrid.innerHTML = '';
  
  // Her 8 saatte bir veri al (1 gün)
  const dailyForecasts = [];
  const seen = {};
  
  for (let i = 0; i < list.length; i++) {
    const date = new Date(list[i].dt * 1000);
    const day = date.toLocaleDateString('tr-TR', { weekday: 'short', month: 'short', day: 'numeric' });
    
    if (!seen[day] && dailyForecasts.length < 5) {
      seen[day] = true;
      dailyForecasts.push(list[i]);
    }
  }
  
  dailyForecasts.forEach(day => {
    const card = document.createElement('div');
    card.className = 'forecast-card';
    
    const date = new Date(day.dt * 1000);
    const dateStr = date.toLocaleDateString('tr-TR', { 
      weekday: 'short', 
      month: 'short', 
      day: 'numeric' 
    });
    
    const icon = getWeatherIcon(day.weather[0].main);
    const temp = Math.round(day.main.temp);
    const desc = day.weather[0].description;
    
    card.innerHTML = `
      <p style="font-weight: bold;">${dateStr}</p>
      <div class="forecast-icon">${icon}</div>
      <p class="forecast-temp">${temp}°C</p>
      <p style="font-size: 0.85em; opacity: 0.8;">${desc}</p>
    `;
    
    forecastGrid.appendChild(card);
  });
  
  document.getElementById('forecastSection').style.display = 'block';
}

// Hava durumuna göre emoji al
function getWeatherIcon(weather) {
  const icons = {
    'Clear': '☀️',
    'Clouds': '☁️',
    'Rain': '🌧️',
    'Drizzle': '🌦️',
    'Thunderstorm': '⛈️',
    'Snow': '❄️',
    'Mist': '🌫️',
    'Smoke': '💨',
    'Haze': '🌫️',
    'Dust': '🌪️',
    'Fog': '🌫️',
    'Sand': '🌪️',
    'Ash': '🌋',
    'Squall': '💨',
    'Tornado': '🌪️'
  };
  return icons[weather] || '🌤️';
}

// Hata göster
function showError(message) {
  const errorDiv = document.getElementById('error');
  errorDiv.textContent = message;
  errorDiv.classList.add('show');
}

// Hatayı gizle
function hideError() {
  document.getElementById('error').classList.remove('show');
}

// Yükleme göster/gizle
function showLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
}
</script>
</body>
</html>
